[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocksync"
version = "1.0.0"
description = "Синхронизация миров Minecraft Java Edition между двумя компьютерами (Windows, macOS) по локальной сети"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.7",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "zeroconf>=0.130",
    "spake2>=0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.11",
    "pillow>=10.0",
]

[project.scripts]
minesync = "blocksync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ресурсы (шрифты, картинки, стили) должны попадать в пакет при установке.
[tool.setuptools.package-data]
blocksync = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
