# Проверка кода на каждый push и pull request: стиль (ruff), типы (mypy) и тесты
# на Windows, macOS и Linux. Сборка программы — в build.yml (только для выпусков).

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Стиль кода (ruff)
        run: ruff check src tests
      - name: Типы (mypy)
        run: mypy

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # окна в тестах не показываются
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Библиотеки для Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Тесты
        run: python -m pytest -q
